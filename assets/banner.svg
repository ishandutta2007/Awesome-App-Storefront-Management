<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Radial Glow Gradients instead of filter="url(#glow)" for GitHub compatibility -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title-main { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 50px; fill: #ffffff; }
    .title-accent { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 50px; fill: url(#primaryGrad); }
    .subtitle-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-label { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .card-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #ffffff; }
    .card-desc { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #94a3b8; }

    /* CSS Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -32; }
    }

    .pulse-orb-1 { animation: pulseGlow 6s infinite ease-in-out; transform-origin: 150px 100px; }
    .pulse-orb-2 { animation: pulseGlow 7s infinite ease-in-out; transform-origin: 1050px 300px; }
    .float-group { animation: floatCard 5s infinite ease-in-out; }
    .dash-flow { stroke-dasharray: 8 8; animation: dashLine 3s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)"/>

  <!-- Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/><line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/><line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/><line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <!-- Glow Circles (Using SVG radial gradients instead of SVG filters) -->
  <circle class="pulse-orb-1" cx="150" cy="100" r="220" fill="url(#glow1)"/>
  <circle class="pulse-orb-2" cx="1050" cy="300" r="250" fill="url(#glow2)"/>

  <!-- Right-side Feature Cards (Floating Visuals) -->
  <g class="float-group" transform="translate(830, 65)">
    <!-- Card 1: Multi-Vendor -->
    <g transform="translate(0, 0)">
      <rect width="270" height="70" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#818cf8" fill-opacity="0.2"/>
      <path d="M 28 35 L 42 35 M 35 28 L 35 42" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
      <text x="65" y="31" class="card-title">Multi-Vendor Management</text>
      <text x="65" y="49" class="card-desc">Seller Payouts &amp; Commission</text>
    </g>

    <!-- Card 2: Headless Architecture -->
    <g transform="translate(-40, 95)">
      <rect width="270" height="70" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#c084fc" fill-opacity="0.2"/>
      <path d="M 27 35 L 43 35 M 35 27 L 35 43" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
      <text x="65" y="31" class="card-title">Headless Architecture</text>
      <text x="65" y="49" class="card-desc">GraphQL / REST Commerce APIs</text>
    </g>

    <!-- Card 3: Monetization -->
    <g transform="translate(10, 190)">
      <rect width="270" height="70" rx="12" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#f472b6" fill-opacity="0.2"/>
      <path d="M 27 39 L 33 32 L 38 36 L 43 28" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="65" y="31" class="card-title">Catalog &amp; Monetization</text>
      <text x="65" y="49" class="card-desc">PIM &amp; Storefront Analytics</text>
    </g>

    <!-- Flow Lines -->
    <path class="dash-flow" d="M 135 70 L 95 95" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.6"/>
    <path class="dash-flow" d="M 95 165 L 145 190" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- Main Left Content -->
  <g transform="translate(70, 75)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="280" height="32" rx="16" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="14" y="21" class="badge-label" fill="#a5b4fc">AWESOME STOREFRONT ECOSYSTEM</text>
    </g>

    <!-- Main Title Lines -->
    <text x="0" y="85" class="title-main">Awesome App Storefront</text>
    <text x="0" y="142" class="title-accent">Management</text>

    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle-text">Curated Multi-Vendor SaaS Platforms, Headless Commerce Engines &amp; Open-Source Tools</text>

    <!-- Sub-Badges -->
    <g transform="translate(0, 220)">
      <rect width="135" height="30" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="14" y="20" class="badge-label">SaaS Platforms</text>

      <rect x="147" y="0" width="160" height="30" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="161" y="20" class="badge-label">Open-Source Repos</text>

      <rect x="319" y="0" width="165" height="30" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="333" y="20" class="badge-label">Headless Storefronts</text>
    </g>
  </g>
</svg>
