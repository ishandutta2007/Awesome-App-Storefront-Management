adless Architecture</text><text x="65" y="49" class="card-desc">GraphQL / REST Commerce APIs</text></g><g transform="translate(830, 65) translate(10, 190)"><rect width="270" height="70" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity=".4" stroke-width="1.5" rx="12"/><circle cx="35" cy="35" r="18" fill="#f472b6" fill-opacity=".2"/><path stroke="#f472b6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 27 39 L 33 32 L 38 36 L 43 28"/><text x="65" y="31" class="card-title">Catalog &amp; Monetization</text><text x="65" y="49" class="card-desc">PIM &amp; Storefront Analytics</text></g><path fill="none" stroke="#818cf8" stroke-width="2" d="M 135 70 L 95 95" class="dash-flow" opacity=".6" transform="translate(830, 65)"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 95 165 L 145 190" class="dash-flow" opacity=".6" transform="translate(830, 65)"/></g><g><g transform="translate(70, 75) translate(0, 0)"><rect width="280" height="32" fill="#6366f1" fill-opacity=".2" stroke="#818cf8" stroke-opacity=".5" rx="16"/><text x="14" y="21" fill="#a5b4fc" class="badge-label">AWESOME STOREFRONT ECOSYSTEM</text></g><text x="0" y="85" class="title-main" transform="translate(70, 75)">Awesome App Storefront</text><text x="0" y="142" class="title-accent" transform="translate(70, 75)">Management</text><text x="0" y="190" class="subtitle-text" transform="translate(70, 75)">Curated Multi-Vendor SaaS Platforms, Headless Commerce Engines &amp; Open-Source Tools</text><g transform="translate(70, 75) translate(0, 220)"><rect width="135" height="30" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".15" rx="8"/><text x="14" y="20" class="badge-label">SaaS Platforms</text><rect width="160" height="30" x="147" y="0" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".15" rx="8"/><text x="161" y="20" class="badge-label">Open-Source Repos</text><rect width="165" height="30" x="319" y="0" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity